{% extends "layout.html" %}
{% block container %}
    <section class="bg-neutral-primary">
        <div class="py-8 px-4 mx-auto max-w-screen-xl text-center lg:py-16 lg:px-12">

            <h1 class="mb-4 text-4xl font-extrabold tracking-tight leading-none text-heading md:text-5xl lg:text-6xl">
                Sistema Escolar de Cursos
            </h1>
            <p class="mb-10 text-lg font-normal text-body lg:text-xl sm:px-16 xl:px-48">
                Gestiona alumnos, maestros y cursos desde un solo lugar.
            </p>

            <div class="flex flex-col mb-8 lg:mb-16 space-y-4 sm:flex-row sm:justify-center sm:space-y-0 sm:space-x-4">
                <a href="{{ url_for('alumnos.index') }}"
                   class="inline-flex justify-center items-center gap-2 py-3 px-5 text-base font-medium text-white bg-sky-500 rounded-base hover:bg-sky-600 focus:ring-4 focus:ring-sky-300 shadow-xs">
                    <svg class="w-5 h-5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"
                         width="24" height="24" fill="none" viewBox="0 0 24 24">
                        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                              d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18Zm0 0a8.949 8.949 0 0 0 4.951-1.488A3.987 3.987 0 0 0 13 16h-2a3.987 3.987 0 0 0-3.951 3.512A8.948 8.948 0 0 0 12 21Zm3-11a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"/>
                    </svg>
                    Alumnos
                </a>
                <a href="{{ url_for('maestros.list_maestros') }}"
                   class="inline-flex justify-center items-center gap-2 py-3 px-5 text-base font-medium text-white bg-amber-500 rounded-base hover:bg-amber-600 focus:ring-4 focus:ring-amber-300 shadow-xs">
                    <svg class="w-5 h-5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"
                         width="24" height="24" fill="none" viewBox="0 0 24 24">
                        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                              d="M4 18v-1a3 3 0 0 1 3-3h4a3 3 0 0 1 3 3v1a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1Zm8-10a3 3 0 1 1-6 0 3 3 0 0 1 6 0Zm7 4h-2m1 1v-2"/>
                    </svg>
                    Maestros
                </a>
                <a href="{{ url_for('cursos.index') }}"
                   class="inline-flex justify-center items-center gap-2 py-3 px-5 text-base font-medium text-white bg-green-500 rounded-base hover:bg-green-600 focus:ring-4 focus:ring-green-300 shadow-xs">
                    <svg class="w-5 h-5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"
                         width="24" height="24" fill="none" viewBox="0 0 24 24">
                        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                              d="M12 6.03v13m0-13c-2.819-.831-4.715-1.076-8.029-1.023A.99.99 0 0 0 3 6v11c0 .563.466.997 1.03.983C7.252 17.84 9.147 18.09 12 19m0-13c2.819-.831 4.715-1.076 8.029-1.023A.99.99 0 0 1 21 6v11c0 .563-.466.997-1.03.983C16.748 17.84 14.853 18.09 12 19"/>
                    </svg>
                    Cursos
                </a>
            </div>

        </div>
    </section>
{% endblock container %}
